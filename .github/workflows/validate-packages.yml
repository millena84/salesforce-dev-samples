name: Validate packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Validate package structure
        id: validate
        continue-on-error: true
        run: |
          python3 scripts/validate_packages.py > validation-report.txt 2>&1

      - name: Create issue for invalid packages
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('validation-report.txt', 'utf8').trim();
            const shortSha = context.sha.slice(0, 7);
            const title = `Validação de pacotes falhou para ${shortSha}`;
            const body = [
              `@${context.actor}, a validação automática dos pacotes falhou para o commit \`${context.sha}\`.`,
              '',
              '```text',
              report,
              '```',
              '',
              'Cada pacote em `low-code/` ou `high-code/` deve conter:',
              '- pelo menos um diretório de componentes',
              '- `DEVELOPMENT.md`',
              '- `USAGE.md`',
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existingIssue = issues.find((issue) => issue.title === title);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Fail workflow when packages are invalid
        if: steps.validate.outcome == 'failure'
        run: |
          cat validation-report.txt
          exit 1
